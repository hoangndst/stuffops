kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dell-cluster
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  disableDefaultCNI: true
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - "localhost"
        - "127.0.0.1"
        - "k8s.hoangndst.com"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  extraMounts:
    - hostPath: /home/hoangndst/Server/kind/k8s-storage
      containerPath: /var/local-path-provisioner
- role: worker
  extraMounts:
    - hostPath: /home/hoangndst/Server/kind/k8s-storage
      containerPath: /var/local-path-provisioner
- role: worker
  extraMounts:
    - hostPath: /home/hoangndst/Server/kind/k8s-storage
      containerPath: /var/local-path-provisioner
- role: worker
  extraMounts:
    - hostPath: /home/hoangndst/Server/kind/k8s-storage
      containerPath: /var/local-path-provisioner
