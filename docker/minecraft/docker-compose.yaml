volumes:
  mc_data:
    external: true
services:
  mc:
    container_name: minecraft_server
    hostname: minecraft_server
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      ONLINE_MODE: FALSE
      CF_API_KEY: ${CF_API_KEY}
      TYPE: "AUTO_CURSEFORGE"
      CF_PAGE_URL: "https://www.curseforge.com/minecraft/modpacks/all-the-mods-8/files/4962718"
      CF_EXCLUDE_MODS: "486778"
      VERSION: "1.19.2"
      MEMORY: "4G"
      MAX_MEMORY: "8G"
    volumes:
      - mc_data:/data
